name: collect

# Runs the ingestion job on a schedule and saves what it collects to the "data" branch.
# The code lives on main; the collected data lives on its own branch so it never mixes
# with code history.

on:
  # The main trigger: an outside cron service calls GitHub's API every 15 minutes to start
  # this workflow (see "Scheduled collection" in the README). GitHub's own schedule proved
  # far too irregular for that: gaps of two to seven hours in testing.
  workflow_dispatch:
  # A backup in case the outside service stops. Extra runs are harmless: a snapshot that is
  # already stored is skipped.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write  # needed to push new snapshots to the data branch

concurrency:
  group: collect  # never run two collections at once
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pipeline code
        uses: actions/checkout@v4

      - name: Check out the data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: collected

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt

      # The collection job only needs the ingest dependencies, not the SQL tooling.
      - run: python -m pip install -r requirements-ingest.txt

      - name: Collect snapshots
        id: collect
        continue-on-error: true  # still save whatever was collected if one source fails
        run: python -m pipeline.ingest --raw-dir collected/raw

      - name: Save new snapshots to the data branch
        working-directory: collected
        run: |
          git add -A .
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Collect snapshots $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:data

      - name: Fail the run if any source failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
